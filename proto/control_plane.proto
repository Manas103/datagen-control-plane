syntax = "proto3";

package datagen;

// A datagen request submitted by a tenant. The coordinator expands this
// into a dependency DAG of jobs; the client never sees job shape at submit
// time, only whether the request was admitted.
message SubmitRequest {
  string request_id = 1;
  int32 tenant_id = 2;
  int32 priority = 3;    // 1 (lowest) .. 5 (highest)
  string payload_kind = 4; // selects which DAG template request_id expands to
}

message SubmitResponse {
  bool admitted = 1;
  string reason = 2;
  int32 job_count = 3;
}

message RequestStateQuery {
  string request_id = 1;
}

message JobState {
  string job_id = 1;
  string state = 2;
}

message RequestStateReply {
  string request_id = 1;
  string state = 2;
  repeated JobState jobs = 3;
}

service ControlPlane {
  // Admission: expands the DAG, records the initial transitions exactly
  // once, and enqueues the request for fair-share dispatch. Must stay fast
  // even when the dispatch backlog is large.
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  rpc GetRequestState(RequestStateQuery) returns (RequestStateReply);
}
